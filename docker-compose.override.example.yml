services:
  frontend:
    image: node:22.16-alpine
    working_dir: "/app"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      BASE_API_URL: ${BASE_API_URL:-/}
    command: "sh -c 'npm install && npm run dev'"
  
  nginx:
    environment:
      - NGINX_PORT=80
    user: root
    ports:
      - "8080:80"